pre-commit:
  parallel: true
  jobs:
    - name: ruff-check
      glob: "*.py"
      run: uv run ruff check --fix {staged_files}
      stage_fixed: true
    - name: ruff-format
      glob: "*.py"
      run: uv run ruff format {staged_files}
      stage_fixed: true
    - name: ty
      glob: "*.py"
      run: uv run ty check {staged_files}
    - name: pyproject-fmt
      glob: "pyproject.toml"
      run: uv run pyproject-fmt {staged_files} || uv run pyproject-fmt --check {staged_files}
      stage_fixed: true
    - name: taplo
      glob: "*.toml"
      exclude:
        - "pyproject.toml"
      run: uv run taplo fmt {staged_files}
      stage_fixed: true
    - name: rumdl
      glob: "*.md"
      run: uv run rumdl fmt {staged_files}
      stage_fixed: true
