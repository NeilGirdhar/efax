[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12.23,<0.13" ]

[project]
name = "efax"
version = "2.6.0"
description = "Exponential families for JAX"
readme = "README.md"
keywords = [
  "bayesian",
  "conjugate-prior",
  "entropy",
  "exponential-family",
  "jax",
  "machine-learning",
  "maximum-likelihood",
  "probability-distributions",
  "statistics"
]
license = "Apache-2.0"
license-files = [ "LICENSE" ]
maintainers = [ { name = "Neil Girdhar", email = "mistersheik@gmail.com" } ]
authors = [ { name = "Neil Girdhar", email = "mistersheik@gmail.com" } ]
requires-python = ">=3.13,<3.16"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "array-api-compat>=1.10",
  "array-api-extra>=0.10.3",
  "jax>=0.10.2",
  "numpy>=2.2",
  "opt-einsum>=3.4",
  "optimistix>=0.0.10",
  "optype[numpy]>=0.8",
  "tjax>=1.9"
]
urls.Changelog = "https://github.com/NeilGirdhar/efax/blob/main/CHANGELOG.md"
urls.Documentation = "https://github.com/NeilGirdhar/efax#readme"
urls.Issues = "https://github.com/NeilGirdhar/efax/issues"
urls.Source = "https://github.com/NeilGirdhar/efax"

[dependency-groups]
dev = [
  "jupyter>=1",
  "lefthook>=2",
  "pyproject-fmt>=2.30",
  "pyrefly>=1",
  "pyright>=1.1.410",
  "pytest>=9",
  "pytest-xdist[psutil]>=3",
  "ruff>=0.17.1",
  "rumdl>=0.3",
  "scipy>=1.16.1",
  "scipy-stubs>=1.15",
  "taplo>=0.9",
  "ty>=0.0.90",
]

[tool.uv]
build-backend.module-root = ""

[tool.ruff]
line-length = 100
lint.select = [ "ALL" ]
lint.ignore = [
  "ambiguous-unicode-character-comment",
  "ambiguous-unicode-character-docstring",
  "assert",
  "blanket-type-ignore",
  "commented-out-code",
  "docstring-extraneous-returns",
  "docstring-missing-exception",
  "docstring-missing-returns",
  "docstring-missing-yields",
  "float-equality-comparison",
  "line-contains-todo",
  "logging-f-string",
  "missing-copyright-notice",
  "missing-todo-author",
  "missing-todo-link",
  "missing-trailing-comma",
  "no-self-use",
  "pandas-use-of-dot-at",
  "parenthesize-chained-operators",
  "typing-only-first-party-import",
  "typing-only-standard-library-import",
  "typing-only-third-party-import",
  "undocumented-magic-method",
  "undocumented-public-class",
  "undocumented-public-function",
  "undocumented-public-init",
  "undocumented-public-method",
  "undocumented-public-module",
  "unused-class-method-argument",
  "unused-function-argument",
  "unused-method-argument",
  "unused-static-method-argument"
]
lint.flake8-errmsg.max-string-length = 40
lint.flake8-import-conventions.extend-aliases."jax.numpy" = "jnp"
lint.flake8-import-conventions.extend-aliases."jax.random" = "jr"
lint.flake8-import-conventions.extend-aliases."jax.scipy.special" = "jss"
lint.flake8-import-conventions.extend-aliases."numpy.typing" = "npt"
lint.flake8-import-conventions.extend-aliases."optype.numpy" = "onp"
lint.flake8-import-conventions.extend-aliases."optype.numpy.compat" = "npc"
lint.flake8-import-conventions.extend-aliases."optype.typing" = "opt"
lint.flake8-import-conventions.extend-aliases."scipy.special" = "sc"
lint.flake8-import-conventions.extend-aliases.array_api_extra = "xpx"
lint.flake8-import-conventions.extend-aliases.ctypes = "ct"
lint.flake8-import-conventions.extend-aliases.datetime = "dt"
lint.flake8-import-conventions.extend-aliases.equinox = "eqx"
lint.flake8-import-conventions.extend-aliases.itertools = "it"
lint.flake8-import-conventions.extend-aliases.networkx = "nx"
lint.flake8-import-conventions.extend-aliases.optimistix = "optx"
lint.flake8-import-conventions.extend-aliases.optype = "op"
lint.flake8-import-conventions.extend-aliases.pyqtgraph = "pg"
lint.flake8-import-conventions.extend-aliases.seaborn = "sns"
lint.isort.combine-as-imports = true
lint.pydocstyle.convention = "google"
lint.pylint.max-args = 8
lint.preview = true

[tool.pyrefly]
project-includes = [ "tests/**/*.py*" ]

[tool.pyright]
include = [ "tests" ]

[tool.pytest]
testpaths = [ "tests" ]
