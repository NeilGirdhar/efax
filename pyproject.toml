[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "jupyter>=1",
  "lefthook>=2",
  "pyrefly>=1.0",
  "pyright>=1.1.410",
  "pytest-xdist[psutil]>=3",
  "pytest>=9",
  "ruff>=0.16.5",
  "scipy-stubs>=1.15",
  "scipy>=1.16.1",
  "toml-sort>=0.24",
  "ty>=0.0.85"
]

[project]
name = "efax"
version = "2.5.0"
description = "Exponential families for JAX"
readme = "README.rst"
requires-python = ">=3.13, <3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Neil Girdhar", email = "mistersheik@gmail.com" }]
maintainers = [{ name = "Neil Girdhar", email = "mistersheik@gmail.com" }]
keywords = [
  "exponential-family",
  "jax",
  "machine-learning",
  "probability",
  "statistics"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed"
]
dependencies = [
  "array-api-compat>=1.10",
  "array-api-extra>=0.10.3",
  "jax>=0.10.2",
  "numpy>=2.2",
  "opt-einsum>=3.4",
  "optimistix>=0.0.10",
  "optype[numpy]>=0.8.0",
  "tjax>=1.7.1"
]

[project.urls]
Changelog = "https://github.com/NeilGirdhar/efax/blob/main/CHANGELOG.md"
Documentation = "https://github.com/NeilGirdhar/efax#readme"
Issues = "https://github.com/NeilGirdhar/efax/issues"
Source = "https://github.com/NeilGirdhar/efax"

[tool.pyrefly]
project-includes = ["tests/**/*.py*"]

[tool.pyright]
include = ["tests"]

[tool.pytest]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
  "ambiguous-unicode-character-comment",
  "ambiguous-unicode-character-docstring",
  "assert",
  "blanket-type-ignore",
  "commented-out-code",
  "docstring-extraneous-returns",
  "docstring-missing-exception",
  "docstring-missing-returns",
  "docstring-missing-yields",
  "float-equality-comparison",
  "line-contains-todo",
  "logging-f-string",
  "missing-copyright-notice",
  "missing-todo-author",
  "missing-todo-link",
  "missing-trailing-comma",
  "no-self-use",
  "pandas-use-of-dot-at",
  "parenthesize-chained-operators",
  "typing-only-first-party-import",
  "typing-only-standard-library-import",
  "typing-only-third-party-import",
  "undocumented-magic-method",
  "undocumented-public-class",
  "undocumented-public-function",
  "undocumented-public-init",
  "undocumented-public-method",
  "undocumented-public-module",
  "unused-class-method-argument",
  "unused-function-argument",
  "unused-method-argument",
  "unused-static-method-argument"
]

[tool.ruff.lint.flake8-errmsg]
max-string-length = 40

[tool.ruff.lint.flake8-import-conventions.extend-aliases]
"array_api_extra" = "xpx"
"ctypes" = "ct"
"datetime" = "dt"
"equinox" = "eqx"
"itertools" = "it"
"jax.numpy" = "jnp"
"jax.random" = "jr"
"jax.scipy.special" = "jss"
"networkx" = "nx"
"numpy.typing" = "npt"
"optimistix" = "optx"
"optype" = "op"
"optype.numpy" = "onp"
"optype.numpy.compat" = "npc"
"optype.typing" = "opt"
"pyqtgraph" = "pg"
"scipy.special" = "sc"
"seaborn" = "sns"

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 8

[tool.uv.build-backend]
module-root = ""
